<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Gasolina ou alcool</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <main>
        <section class="card">
    <h1>Álcool ou Gasolina?</h1>
    <h2>Descubra qual combustivel compensa mais</h2>
     <div class="linha"></div>
    <form action="#">
      <p>
        <label for="gasolina">Preço da Gasolina por litro(R$)</label>
        <input type="number" step="0.1" id="gasolina" placeholder="Digite o preço da gasolina"/>
       </p>
       <p>
        <label for="alcool">Preço do Álcool por litro(R$)</label>
        <input type="number" step="0.1" id="alcool" placeholder="Digite o preço do Álcool"/>
       </p>

      <button onclick="calculo()">Calcular</button>
       <div class="linha"></div>
      <p></p>
    </form>
    <div class="final">
   <h3>Resultado</h3>
    <p>Preencha os valores para ver qual combustivel compensa mais</p>
    </div>
    </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
